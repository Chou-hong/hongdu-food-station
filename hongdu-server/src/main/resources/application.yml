server:
  port: 8080

spring:
  profiles:
    active: dev
  main:
    allow-circular-references: true
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  datasource:
    druid:
      driver-class-name: ${hongdu.datasource.driver-class-name}
      url: jdbc:mysql://${hongdu.datasource.host}:${hongdu.datasource.port}/${hongdu.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: ${hongdu.datasource.username}
      password: ${hongdu.datasource.password}
    data:
      redis:
        host: ${hongdu.redis.host}
        port: ${hongdu.redis.port}
        password: ${hongdu.redis.password}
        database: ${hongdu.redis.database}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.hongdu.entity
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com:
      hongdu:
        mapper: debug
        service: info
        controller: info
    org:
      springdoc: DEBUG

# knife4j / springdoc 接口文档（分组通过 WebMvcConfiguration 中的 GroupedOpenApi Bean 定义）
springdoc:
  api-docs:
    enabled: true

knife4j:
  enable: true
  setting:
    language: zh_cn
    enable-version: true

hongdu:
  jwt:
    # 注：jjwt 0.11.x 要求 HS256 密钥长度不低于 32 字节（256 位）
    admin-secret-key: hongdu-food-station-admin-secret-key-2026
    admin-ttl: 7200000
    admin-token-name: token
    user-secret-key: hongdu-food-station-user-secret-key-2026
    user-ttl: 7200000
    user-token-name: authentication
  alioss:
    endpoint: ${hongdu.alioss.endpoint}
    access-key-id: ${hongdu.alioss.access-key-id}
    access-key-secret: ${hongdu.alioss.access-key-secret}
    bucket-name: ${hongdu.alioss.bucket-name}
  wechat:
    appid: ${hongdu.wechat.appid}
    secret: ${hongdu.wechat.secret}
    mchid: ${hongdu.wechat.mchid}
    mchSerialNo: ${hongdu.wechat.mchSerialNo}
    privateKeyFilePath: ${hongdu.wechat.privateKeyFilePath}
    apiV3Key: ${hongdu.wechat.apiV3Key}
    weChatPayCertFilePath: ${hongdu.wechat.weChatPayCertFilePath}
    notifyUrl: ${hongdu.wechat.notifyUrl}
    refundNotifyUrl: ${hongdu.wechat.refundNotifyUrl}
  shop:
    # 红都食驿门店地址（江西瑞金）
    address: 江西省瑞金市红都大道188号
  baidu:
    ak: your-ak
